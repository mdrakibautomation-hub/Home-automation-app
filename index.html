<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ESP32 GPIO Controller</title>

<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>

</head>
<body>

<div class="card">

  <h1>ESP32 GPIO Control</h1>
  <div id="statusBadge" class="status-badge offline">Offline</div>

  <!-- Login UI -->
  <div id="authBox">
    <input id="emailField" type="email" placeholder="Email" />
    <input id="passwordField" type="password" placeholder="Password" />
    <button id="loginBtn" class="btn login-btn">Login</button>
    <p id="authMsg"></p>
  </div>

  <!-- Control UI -->
  <div id="controlBox" style="display:none;">

    <!-- GPIO Buttons -->
    <button id="gpio1Btn" class="gpio-button" data-gpio="gpio1">GPIO 1</button>
    <div id="gpio1Status" class="gpio-status">Status: OFF</div>

    <button id="gpio2Btn" class="gpio-button" data-gpio="gpio2">GPIO 2</button>
    <div id="gpio2Status" class="gpio-status">Status: OFF</div>

    <button id="gpio3Btn" class="gpio-button" data-gpio="gpio3">GPIO 3</button>
    <div id="gpio3Status" class="gpio-status">Status: OFF</div>

    <button id="gpio4Btn" class="gpio-button" data-gpio="gpio4">GPIO 4</button>
    <div id="gpio4Status" class="gpio-status">Status: OFF</div>

    <button id="gpio5Btn" class="gpio-button" data-gpio="gpio5">GPIO 5</button>
    <div id="gpio5Status" class="gpio-status">Status: OFF</div>

    <button id="gpio6Btn" class="gpio-button" data-gpio="gpio6">GPIO 6</button>
    <div id="gpio6Status" class="gpio-status">Status: OFF</div>

    <button id="gpio7Btn" class="gpio-button" data-gpio="gpio7">GPIO 7</button>
    <div id="gpio7Status" class="gpio-status">Status: OFF</div>

    <button id="gpio8Btn" class="gpio-button" data-gpio="gpio8">GPIO 8</button>
    <div id="gpio8Status" class="gpio-status">Status: OFF</div>

    <!-- Fan Control -->
    <h3 class="fan-title">Fan Speed</h3>
    <input type="range" id="fanSlider" min="0" max="100" value="0" class="fan-slider">
    <p id="fanLabel" class="fan-label">Speed: 0%</p>

    <!-- Logout -->
    <button id="logoutBtn" class="btn logout-btn">Logout</button>
  </div>

</div>

</body>
</html>
